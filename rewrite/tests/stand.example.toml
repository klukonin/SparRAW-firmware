# Описание стенда для pytest (tests/README.md). Скопировать в tests/stand.toml (вне git) и поправить адреса.
# Два узла OpenWrt с wil6210 (Sparrow) по ssh без пароля (ключ), питание — розетки Tapo (SparRAW-tools/host/tapo_plug.py).

[dut]                         # тестируемый узел: на него заливается проверяемый образ
host = "root@192.0.2.12"
mac = "02:00:00:00:00:12"     # MAC радио dut (точка снимает его зависшую запись перед загрузкой)
ip = "10.60.0.12"             # адрес в радиоканале
# sta_network = "wl60"        # сеть uci интерфейса в роли станции (по умолчанию не трогать)
power = { kind = "tapo", addr = "192.0.2.105" }

[peer]                        # партнёр: обычно точка доступа на своей прошивке
host = "root@192.0.2.11"
ip = "10.60.0.11"
ssid = "SPARRAW-STAND"        # SSID точки peer
fw_backup = "/lib/firmware/wil6210.fw.backup"   # своя прошивка peer-точки (копируется в /tmp/sparraw-fw при загрузке)
# modparams = ""              # параметры insmod peer-точки; отладку (uc_trace_ms, fw_log_level) — только в итерации, где она нужна: меняет условия прогона
power = { kind = "tapo", addr = "192.0.2.104" }

[tools]
tapo = "../../SparRAW-tools/host/tapo_plug.py"  # относительно rewrite/

[test]
ap_ssid = "SPARRAW-AP-TEST"   # SSID точки dut в тесте AP
iperf_s = 8
min_up_mbps = 500             # пороги пропускной способности
min_down_mbps = 500
iperf_long_s = 300            # длинные замеры test_throughput_long_up/down (test_sta, test_ap): длительность iperf3
iperf_long_interval_s = 10    # интервал отчёта iperf3
iperf_long_min_frac = 0.5     # ни одного интервала ниже доли порога (min_up_mbps / min_down_mbps)
irq_cpu = "2"                 # маска CPU прерываний wil6210 на обоих узлах (cpu1; не ядро iperf и не ядро RPS wifi)
iperf_cpu = "4"               # маска CPU для iperf3 (taskset)
brd_md5 = ""                  # md5 /lib/firmware/wil6210.brd обоих узлов (плата малой мощности); пусто — не проверять
modparams = ""                # параметры insmod узлов на проверяемом образе (станция peer в тесте AP — ещё no_fw_recovery=Y)
max_power_cycles = 1          # снятий питания на узел за прогон, только если узел не отвечает по ssh (docs/STAND.md)
reboot = "force"              # force — sync; reboot -f мимо procd (по умолчанию), init — обычный reboot
# max_fw_starts = 1           # стартов прошивки (FW ver. в dmesg) за подъём роли; по умолчанию по роли: STA 1, AP 2 (hostapd)
